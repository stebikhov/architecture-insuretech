"""
GraphQL схема для сервиса управления клиентскими данными (client-info)
Создана на основе существующего REST API контракта
"""

type Query {
  """
  Получение информации о клиенте по идентификатору
  """
  client(id: ID!): Client
  
  """
  Получение списка клиентов (для возможного расширения функциональности)
  """
  clients: [Client]
}

"""
Тип, представляющий клиента сервиса
"""
type Client {
  """
  Уникальный идентификатор клиента
  """
  id: ID!
  
  """
  Имя клиента
  """
  name: String!
  
  """
  Возраст клиента
  """
  age: Int!
  
  """
  Список документов клиента
  Может быть запрошен в том же запросе, что и основная информация о клиенте
  """
  documents: [Document!]
  
  """
  Список родственников клиента
  Может быть запрошен в том же запросе, что и основная информация о клиенте
  """
  relatives: [Relative!]
}

"""
Тип, представляющий документ клиента
"""
type Document {
  """
  Уникальный идентификатор документа
  """
  id: ID!
  
  """
  Тип документа (паспорт, водительское удостоверение и т.д.)
  """
  type: String!
  
  """
  Номер документа
  """
  number: String!
  
  """
  Дата выдачи документа в формате ISO 8601
  """
  issueDate: String!
  
  """
  Дата окончания действия документа в формате ISO 8601
  """
  expiryDate: String
}

"""
Тип, представляющий родственника клиента
"""
type Relative {
  """
  Уникальный идентификатор родственника
  """
  id: ID!
  
  """
  Тип родственной связи (супруг, ребёнок, родитель и т.д.)
  """
  relationType: String!
  
  """
  Имя родственника
  """
  name: String!
  
  """
  Возраст родственника
  """
  age: Int!
}