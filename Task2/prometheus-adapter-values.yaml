# Минимальная конфигурация Prometheus Adapter: единственное правило
# преобразует счётчик http_requests_total в метрику http_requests_per_second,
# доступную Kubernetes Custom Metrics API в разрезе "на один под" (Pods metric).
# Именно эта метрика используется в HPA для масштабирования по RPS.
prometheus:
  url: http://prometheus-server.monitoring.svc
  port: 80

rules:
  default: false
  custom:
    - seriesQuery: 'http_requests_total{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace:
            resource: "namespace"
          pod:
            resource: "pod"
      name:
        matches: "^http_requests_total$"
        as: "http_requests_per_second"
      metricsQuery: 'sum(rate(<<.Series>>{<<.LabelMatchers>>}[2m])) by (<<.GroupBy>>)'
