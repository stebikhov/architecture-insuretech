# Task6/nginx.conf
# Ограничение частоты запросов: не более 20 запросов в секунду (20 RPS) от одного партнёра.
# При превышении лимита клиент получает HTTP 429 Too Many Requests.

# Без секции events nginx не проходит проверку nginx -t
events {
    worker_connections 1024;
}

http {
    # ------------------------------------------------------------------
    # Ключ, по которому рассчитывается лимит интенсивности запросов.
    # Если партнёр передаёт заголовок X-API-Key, лимит рассчитывается по ключу.
    # Это обеспечивает выделение персональной квоты каждому партнёру вне
    # зависимости от сетевой трансляции адресов (NAT) или распределения по IP.
    # При отсутствии заголовка ограничение применяется по IP-адресу клиента.
    # ------------------------------------------------------------------
    map $http_x_api_key $limit_key {
        default $http_x_api_key;
        ""      $binary_remote_addr;
    }

    # Зона разделяемой памяти для счётчиков:
    #   zone=partner_limit:10m — 10 МБ для хранения состояний ключей;
    #   rate=20r/s             — целевой SLA: не более 20 запросов в секунду (20 RPS).
    limit_req_zone $limit_key zone=partner_limit:10m rate=20r/s;

    # Код ответа при превышении лимита (по умолчанию nginx вернул бы 503)
    limit_req_status 429;

    # Уровень логирования отклонённых запросов
    limit_req_log_level warn;

    # Настройка upstream для балансировки нагрузки
    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
    }

    server {
        listen 80;

        location / {
            # Применение ограничения к входящим запросам к API.
            # Параметр burst=5 nodelay сглаживает кратковременные всплески
            # сетевого трафика без искусственной задержки обработки.
            limit_req zone=partner_limit burst=5 nodelay;

            proxy_pass http://backend_servers;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Ответ клиенту при превышении лимита интенсивности запросов
        error_page 429 = @rate_limited;

        location @rate_limited {
            default_type application/json;
            add_header Retry-After 1 always;
            return 429 '{"error":"Too Many Requests","message":"Rate limit exceeded: max 20 requests per second"}';
        }
    }
}